<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>photobooth</title>
        <link rel="stylesheet" href="styles.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
        >
    </head>
    <body>
        <h1>photobooth</h1>


        <div id="welcome-screen">
            <h2>How would you like to make your photostrip?</h2>
            <button id="choose-camera">Take Photos</button>
            <button id="choose-upload">Upload Photos</button>
        </div>



        <div id="camera-section">
            <h2>Take your photos!</h2>
            <button id="start-camera">Start Camera</button>
            <button id="camera-back">← Back to Home</button>

            <div class="filter-options">
                <button id="color-filter">Color</button>
                <button id="bw-filter">Black & White</button>
            </div>

            <div class="camera-container">
                <video id="camera-preview" autoplay playsinline></video>
                <p id="countdown"></p>
                <div id="camera-flash"></div>
            </div>
            <button id="take-photo">Take Photo 📸</button>
            <img id="snapshot-preview">
            
        </div>


        <div id="upload-section">
            <h2>Upload your photos!</h2>

            <input
                type="file"
                id="image-upload"
                accept=".png, .jpeg, .jpg, .heic"
                multiple
            >
            <p id="crop-progress">Photo 1 of 4</p>
            <div class="crop-container">
                <img id="crop-image" alt="Photo being edited">
            </div>
            <button id="apply-crop">Apply Crop</button>
            <button id="upload-back">← Back to Home</button>
        </div>


        <div id="results-section">
            <h2>Your photostrip is ready! ♡</h2>

            <canvas id="photo-strip" width="600" height="1800"></canvas>

            <button id="download-photo">Download 📥</button>
            <button id="share-photo">Share 💌</button>
            <button id="retake-photo">Retake Photos 📸</button>
        </div>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
