<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My Photobooth</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>photobooth</h1>
        <p>turn your favorite memories into a cute photostrip</p>
        <div>
            <input
                type="file"
                id="image-upload"
                accept=".png, .jpeg, .jpg, .heic" 
                multiple
            />
        </div>

        <canvas id="photo-strip" width="192" height="576"></canvas>

        <script src="script.js"></script>
    </body>
</html>
