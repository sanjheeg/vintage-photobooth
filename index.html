<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>photobooth</title>
        <link rel="stylesheet" href="styles.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
        >
    </head>
    <body>
        <h1>photobooth</h1>
    
        <h2>Or take your photos!</h2>
        <button id="start-camera">Start Camera</button>
        <video id="camera-preview" autoplay playsinline></video>
        <button id="take-photo">Take Photo 📸</button>
        <img id="snapshot-preview" alt="Captured photo">


        <p>turn your favorite memories into a cute photostrip</p>
        <div>
            <input
                type="file"
                id="image-upload"
                accept=".png, .jpeg, .jpg, .heic" 
                multiple
            />
        </div>
        <p id="crop-progress">Photo 1 of 4</p>
        <div class="crop-container">
            <img id="crop-image" alt="Photo being edited">
        </div>

        <button id="apply-crop">Apply Crop</button>
        <canvas id="photo-strip" width="600" height="1800"></canvas>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
